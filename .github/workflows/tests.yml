# Runs Just Say It's tests on every push and pull request.
# Created by Stefano Roman Gunness · MIT License
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-rules:
    name: Text rules (Windows app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test windows/JustSayIt.Tests/JustSayIt.Tests.csproj

  windows-build:
    name: Build (Windows app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build windows/JustSayIt/JustSayIt.csproj -c Release

  windows-selftest:
    name: End-to-end self-test (real Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Cache speech and local AI models
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\JustSayIt\models
          key: models-whisper-base-qwen25-1p5b-v1
      - name: Publish
        run: dotnet publish windows/JustSayIt/JustSayIt.csproj -c Release -r win-x64 --self-contained true -o out
      - name: Run self-test
        shell: pwsh
        run: |
          $p = Start-Process out\JustSayIt.exe -ArgumentList "--selftest", "$PWD\selftest-report.txt" -PassThru
          $finished = $p.WaitForExit(1800000)
          if (Test-Path selftest-report.txt) { Get-Content selftest-report.txt }
          if (-not $finished) { $p.Kill(); throw "Self-test timed out" }
          exit $p.ExitCode
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: windows-selftest-report
          path: selftest-report.txt

  windows-standard-user:
    name: Install + run without admin (standard Windows user)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build app and installer
        shell: pwsh
        run: |
          dotnet publish windows/JustSayIt/JustSayIt.csproj -c Release -r win-x64 --self-contained true -o windows/dist/JustSayIt
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer\JustSayIt.iss
          Compress-Archive -Path windows/dist/JustSayIt/* -DestinationPath windows/dist/portable.zip
      - name: Check the app asks for no admin rights
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter mt.exe | Where-Object FullName -like "*x64*" | Select-Object -First 1
          & $sdk.FullName -nologo -inputresource:"windows\dist\JustSayIt\JustSayIt.exe;#1" -out:manifest.xml
          Get-Content manifest.xml
          if (-not (Select-String -Path manifest.xml -Pattern 'level="asInvoker"' -Quiet)) { throw "App manifest does not request asInvoker" }
      - name: Install and run as a standard user (no admin)
        shell: pwsh
        run: |
          $user = "jsitest"
          # 14 characters max: longer passwords make "net user" stop and ask a question.
          $pw = "Jt" + [guid]::NewGuid().ToString("N").Substring(0, 8) + "!a1"
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name $user -Password $sec -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Users" -Member $user
          Get-LocalUser $user | Format-Table Name, Enabled
          # Not added to Administrators: a normal user account.
          if (Get-LocalGroupMember -Group "Administrators" | Where-Object Name -like "*\$user") { throw "test user is an admin" }
          $cred = New-Object PSCredential(".\$user", (ConvertTo-SecureString $pw -AsPlainText -Force))
          $work = "C:\jsitest"; New-Item -ItemType Directory $work -Force | Out-Null
          Copy-Item (Get-Item windows\dist\JustSayIt-Setup-*.exe).FullName "$work\setup.exe"
          Copy-Item windows\dist\portable.zip "$work\portable.zip"
          icacls $work /grant "${user}:(OI)(CI)F" | Out-Null

          $script = @'
          $ErrorActionPreference = "Stop"
          $log = "C:\jsitest\result.txt"
          function Say($m) { Add-Content $log $m }
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $admin = (New-Object Security.Principal.WindowsPrincipal $id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Say "user=$($id.Name) admin=$admin"
          # 1. Installer (per-user)
          $p = Start-Process C:\jsitest\setup.exe -ArgumentList "/VERYSILENT","/CURRENTUSER","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=" -PassThru
          $p.WaitForExit()
          $exe = Join-Path $env:LOCALAPPDATA "Programs\JustSayIt\JustSayIt.exe"
          Say "installer exit=$($p.ExitCode) installed=$(Test-Path $exe) path=$exe"
          # 2. App runs as this user
          $app = Start-Process $exe -ArgumentList "--selftest","C:\jsitest\selftest.txt" -PassThru
          $done = $app.WaitForExit(600000)
          Say "app finished=$done exit=$($app.ExitCode)"
          # 3. Uninstall (per-user)
          $un = Get-ChildItem (Split-Path $exe) -Filter "unins*.exe" | Select-Object -First 1
          $u = Start-Process $un.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          $u.WaitForExit()
          Start-Sleep 3
          Say "uninstall exit=$($u.ExitCode) removed=$(-not (Test-Path $exe))"
          # 4. Portable mode (no installer at all)
          $dir = Join-Path $env:LOCALAPPDATA "Programs\JustSayIt"
          Expand-Archive C:\jsitest\portable.zip -DestinationPath $dir -Force
          $pp = Start-Process (Join-Path $dir "JustSayIt.exe") -ArgumentList "--selftest","C:\jsitest\selftest-portable.txt" -PassThru
          $pdone = $pp.WaitForExit(600000)
          Say "portable finished=$pdone exit=$($pp.ExitCode)"
          '@
          Set-Content "$work\run.ps1" $script

          # Run the script as the standard user.
          # "Batch" logon needs that right; grant it (to this test account only) for the scheduled task.
          $sid = (Get-LocalUser $user).SID.Value
          secedit /export /cfg C:\jsitest\sec.inf /areas USER_RIGHTS | Out-Null
          $inf = Get-Content C:\jsitest\sec.inf
          if ($inf -match "^SeBatchLogonRight") { $inf = $inf -replace "^(SeBatchLogonRight = .*)$", "`$1,*$sid" } else { $inf = $inf -replace "^\[Privilege Rights\]$", "[Privilege Rights]`r`nSeBatchLogonRight = *$sid" }
          Set-Content C:\jsitest\sec.inf $inf -Encoding Unicode
          secedit /configure /db C:\jsitest\sec.sdb /cfg C:\jsitest\sec.inf /areas USER_RIGHTS | Out-Null
          # Create the user's profile folder first (normally done at first sign-in).
          Start-Process cmd.exe -ArgumentList "/c echo profile" -Credential $cred -LoadUserProfile -Wait -WindowStyle Hidden

          $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NoProfile -ExecutionPolicy Bypass -File $work\run.ps1"
          Register-ScheduledTask -TaskName "jsitest" -Action $action -User "$env:COMPUTERNAME\$user" -Password $pw -RunLevel Limited | Out-Null
          Start-ScheduledTask -TaskName "jsitest"
          $deadline = (Get-Date).AddMinutes(15)
          do { Start-Sleep 10; $state = (Get-ScheduledTask -TaskName "jsitest").State } while ($state -ne "Ready" -and (Get-Date) -lt $deadline)
          $info = Get-ScheduledTaskInfo -TaskName "jsitest"
          Write-Host ("task state={0} lastResult=0x{1:X}" -f $state, $info.LastTaskResult)

          Write-Host "---- result ----"
          if (-not (Test-Path "$work\result.txt")) { throw "the standard-user script did not run (see task result above)" }
          Get-Content "$work\result.txt"
          foreach ($f in "selftest.txt","selftest-portable.txt") { if (Test-Path "$work\$f") { Write-Host "---- $f ----"; Get-Content "$work\$f" } }
          $r = Get-Content "$work\result.txt" -Raw
          if ($r -notmatch "admin=False") { throw "test did not run as a standard user" }
          if ($r -notmatch "installer exit=0 installed=True") { throw "per-user install failed" }
          if ($r -notmatch "removed=True") { throw "per-user uninstall failed" }
          if ($r -notmatch "app finished=True") { throw "app did not run" }
          if ($r -notmatch "portable finished=True") { throw "portable app did not run" }
          # The app started and ran its checks as a normal user; settings + speech model live in the user's folders.
          if (-not (Select-String "$work\selftest.txt" -Pattern "PASS  Settings load/save" -Quiet)) { throw "app could not save settings as a standard user" }
          Write-Host "Installed, ran and uninstalled as a standard user with no administrator rights."

  mac:
    name: Build + text rules (Mac app)
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - run: swift build -c release
      - run: swift run -c release RuleTests
